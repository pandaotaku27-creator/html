    let noClickCount = 0;

    function createFloatingHearts() {

    document.body.appendChild(cat);

        document.body.appendChild(text);

            text.remove();
        }, 2000);

        const hugContainer = document.createElement('div');
        hugContainer.className = 'hug-container';

        hugEmoji.className = 'hug-emoji';

    const hugText = document.createElement('div');
    hugText.className = 'hug-text';
    hugText.textContent = 'I Love You So Much! 💕';
        hugContainer.appendChild(hugEmoji);
        hugContainer.appendChild(hugText);
        document.body.appendChild(hugContainer);

        setTimeout(() => {
            hugContainer.remove();
        }, 3000);
    }

    // Create confetti effect
    function createConfetti() {
        const confettiPieces = ['🎉', '🎊', '✨', '💖', '💝', '🎈'];
        
        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti confetti-piece';
            confetti.textContent = confettiPieces[Math.floor(Math.random() * confettiPieces.length)];
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = '-20px';
            
            const tx = (Math.random() - 0.5) * 600;
            const ty = Math.random() * 600 + 300;
            confetti.style.setProperty('--tx', tx + 'px');
            confetti.style.setProperty('--ty', ty + 'px');
            
            document.body.appendChild(confetti);
            
            setTimeout(() => confetti.remove(), 3000);
        }
    }

    function createBalloons() {
        const balloonColors = ['#ff4d6d', '#ff1744', '#ff6b9d', '#ffc0cb', '#ff69b4'];

            balloon.style.bottom = '-60px';
            balloon.style.animationDelay = Math.random() * 0.5 + 's';
            
            document.body.appendChild(balloon);
            
            setTimeout(() => balloon.remove(), 4500);
        }
    }

    // Handle Yes button
    function handleYes(slideNumber) {
        // Reset NO counter
        noClickCount = 0;

        // Show cute cat
        showCuteCat();

        // Create celebration effects
        createConfetti();
        createBalloons();
        
        // Show hug
        setTimeout(() => {

        // Celebrate pulse animation
        const card = document.querySelector('.card:not(.hidden)');
        card.classList.add('celebrate');
        
        setTimeout(() => {
            card.classList.remove('celebrate');
            nextSlide(slideNumber);
        }, 3500);
    }

            // First two times: just shake and disappear

            noButton.disabled = true;

            }, 500);
        }

        document.querySelectorAll('.card').forEach(card => {
            card.classList.add('hidden');
        });
        document.getElementById('slide' + number).classList.remove('hidden');

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffd6e8 0%, #c9e4ff 50%, #f0d9ff 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            color: #6b4c9a;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Bunnies Background Animation */
        .heart-background {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            font-size: 2rem;
            opacity: 0.5;
            animation: float-up 6s infinite ease-in;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 30px;
            border: 2px solid rgba(255, 192, 203, 0.5);
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.6s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        p {
            font-size: 1.2rem;
            margin: 15px 0;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        .button-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        button {
            padding: 15px 35px;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .yes {
            background: linear-gradient(135deg, #ff4d6d, #ff1744);
            color: white;
        }

        .yes:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 30px rgba(255, 77, 109, 0.5);
        }

        .yes:active {
            transform: scale(0.98);
        }

        .no {
            background: rgba(255, 255, 255, 0.9);
            color: #ff4d6d;
            font-weight: bold;
        }

        .no:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.5);
        }

        .hidden {
            display: none !important;
        }

        /* Confetti Animation */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 999;
        }

        .confetti-piece {
            animation: confetti-fall 3s ease-out forwards;
        }

        @keyframes confetti-fall {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) rotate(720deg);
                opacity: 0;
            }
        }

        /* Balloon Animation */
        .balloon {
            position: fixed;
            width: 40px;
            height: 50px;
            border-radius: 50% 50% 50% 0;
            pointer-events: none;
            z-index: 999;
            animation: balloon-float 4s ease-in forwards;
        }

        @keyframes balloon-float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-150vh) rotate(20deg);
                opacity: 0;
            }
        }

        /* Warning Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.5s;
        }

        /* Celebration Animation */
        @keyframes celebration-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .celebrate {
            animation: celebration-pulse 0.6s !important;
        }

        /* Final Message */
        .final-message {
            font-size: 1.5rem;
            line-height: 1.8;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .emoji-large {
            font-size: 4rem;
            margin: 20px 0;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Cute Cat Popup */
        .cat-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            z-index: 2000;
            animation: catBounce 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes catBounce {
            0% {
                transform: translate(-50%, -50%) scale(0);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .cat-text {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            font-weight: bold;
            color: #ff69b4;
            z-index: 2000;
            animation: fadeInOut 2s ease-in-out;
            pointer-events: none;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        @keyframes fadeInOut {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Hug Gif Display */
        .hug-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            text-align: center;
            pointer-events: none;
        }

        .hug-emoji {
            font-size: 10rem;
            animation: hugAnimation 3s ease-in-out forwards;
            margin-bottom: 20px;
        }

        @keyframes hugAnimation {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.1) rotate(5deg);
            }
            100% {
                opacity: 0;
                transform: scale(0.5) rotate(-5deg);
            }
        }

        .hug-text {
            font-size: 2rem;
            color: #ff69b4;
            font-weight: bold;
            animation: hugTextFade 3s ease-in-out forwards;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        @keyframes hugTextFade {
            0% { opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Audio Player */
        .audio-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .audio-player audio {
            width: 200px;
            height: 40px;
        }
    </style>
</head>

            // First two times: just shake and disappear
            const noButton = card.querySelector('.no');
            noButton.style.opacity = '0.5';
            noButton.disabled = true;
            alert(`Come on honey... 💕 (${3 - noClickCount} chances left)`);
            
            setTimeout(() => {
                noButton.style.opacity = '1';
                noButton.disabled = false;
                card.classList.remove('shake');
            }, 500);
        } else {
            // Third time: final warning
            alert('⚠️ Stop messing with me honey or I\'ll kill you! 💔\nYou MUST say YES! 💕');
            noClickCount = 0; // Reset counter
            
            setTimeout(() => {
                card.classList.remove('shake');
            }, 500);
        }
    }

    // Navigate to next slide
    function nextSlide(number) {
        document.querySelectorAll('.card').forEach(card => {
            card.classList.add('hidden');
        });
        document.getElementById('slide' + number).classList.remove('hidden');
    }

    // Initialize floating hearts on page load
    window.addEventListener('load', createFloatingHearts);
</script>

</body>
</html>
